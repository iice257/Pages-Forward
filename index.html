<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages Forward | Bookstore Purchases</title>
  <meta name="description"
    content="Browse the current Pages Forward bookstore inventory, add available books to cart, upload payment receipt, and complete a purchase.">
  <meta name="theme-color" content="#f8f5f0">
  <meta property="og:title" content="Pages Forward | Bookstore Purchases">
  <meta property="og:description"
    content="A real bookstore catalog for selecting available books, paying by transfer, and sharing purchase details.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pages-forward.vercel.app/">
  <meta property="og:image" content="https://pages-forward.vercel.app/assets/social-preview.svg">
  <meta property="og:image:alt" content="Pages Forward bookstore purchase catalog preview">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pages Forward | Bookstore Purchases">
  <meta name="twitter:description"
    content="Select available books, pay by transfer, upload a receipt, and contact the bookstore.">
  <meta name="twitter:image" content="https://pages-forward.vercel.app/assets/social-preview.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#DFBD69;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#F9ECA5;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#B88A44;stop-opacity:1" />
      </linearGradient>
    </defs>
  </svg>
  <script>if (localStorage.getItem('pfIntroSeen') || new URLSearchParams(location.search).has('skipIntro')) { document.body.classList.add('skip-intro') }</script>
  <div id="introOverlay">
    <div class="intro-content">
      <div class="intro-huge">Pages Forward</div>
      <div class="intro-sub"><span class="intro-gold">Bookstore</span> Purchases</div>
      <svg class="intro-icon gold" viewBox="0 0 24 24" style="margin-top: 1rem" fill="none" stroke="url(#gold-grad)"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1" />
        <path d="M12 8v13" />
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" />
      </svg>
    </div>
  </div>
  <div class="blur-c">
    <div class="blur-bg" id="bb1"></div>
    <div class="blur-bg" id="bb2"></div>
    <div class="blur-ov"></div>
  </div>
  <div class="bg-right"></div>
  <header class="header">
    <div class="header-logo">
      Pages Forward
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gold-grad)" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1" />
        <path d="M12 8v13" />
        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
        <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" />
      </svg>
    </div>
    <div class="header-actions">
      <button class="btn-h theme-toggle" id="themeToggle" aria-label="Toggle color theme" title="Theme"><svg
          viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg></button>
      <a class="purchase-history-link" href="purchases.html" aria-label="View saved purchases" title="My Purchases">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5h18v14H3z" />
          <path d="M7 9h10M7 13h7" />
        </svg>
      </a>
      <button class="folder-btn" id="folderBtn">
        <svg class="folder-icon" viewBox="0 0 24 24">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg>
        <span class="folder-badge" id="folderBadge">0</span>
      </button>

      <button class="btn-h btn-control" id="fullListBtn">Catalog</button>
      <div class="coll-preview" id="collPreview">
        <div class="coll-label">Cart</div>
        <div class="coll-items" id="collItems"></div>
        <div class="coll-preview-total" id="collPreviewTotal"
          style="padding:0.5rem 1rem;color:var(--gold);font-family:var(--fb);text-align:right;font-size:0.9rem;border-top:1px solid var(--sand);margin-top:0.5rem;padding-top:0.5rem">
          Transfer after checkout</div>
        <button class="view-all-btn" id="viewAllBtn" style="margin-top:0.5rem">Checkout</button>
      </div>
    </div>
  </header>
  <div class="slider-vp">
    <div class="slider-track" id="sliderTrack"></div>
  </div>
  <button class="nav-arrow prev" id="prevBtn"><svg viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6" />
    </svg></button>
  <button class="nav-arrow next" id="nextBtn"><svg viewBox="0 0 24 24">
      <polyline points="9 18 15 12 9 6" />
    </svg></button>
  <nav class="arc-car">
    <div class="arc-vp">
      <div class="arc-track" id="arcTrack"></div>
    </div>
  </nav>
  <div class="gallery-ov" id="galleryOv">
    <div class="gallery-hdr">
      <h2 class="gallery-title">Book Catalog</h2>
      <div class="gallery-controls">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="color:var(--stone)">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" class="search-input" id="gallerySearch" placeholder="Search...">
        </div>
      </div>
      <button class="gallery-close" id="galleryClose">&times;</button>
    </div>
    <!-- Empty State -->
    <div class="gallery-empty" id="galleryEmpty">
      <div class="gallery-empty-text">No books match your search</div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
  <div class="coll-ov" id="collOv">
    <div class="coll-modal">
      <div class="coll-modal-hdr">
        <h3 class="coll-modal-title">Cart</h3><button class="gallery-close" id="collClose">&times;</button>
      </div>
      <div class="coll-modal-grid" id="collGrid"></div>
    </div>
  </div>
  <div class="coll-ov" id="requestOv" style="z-index: 2000;">
    <div class="coll-modal" style="max-width: 500px; height: auto; max-height: 90vh;">
      <div class="coll-modal-hdr">
        <h3 class="coll-modal-title">Purchase</h3><button class="gallery-close" id="requestClose">&times;</button>
      </div>
      <div class="request-body" id="requestBody" style="padding: 2rem; overflow-y: auto;">
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/data.js"></script>
  <script>
    // Simplified module - search only
    const SearchModule = {
      state: { searchQuery: '' },
      setSearch(query) {
        this.state.searchQuery = query.toLowerCase().trim();
      },
      process(books) {
        let result = [...books];
        if (this.state.searchQuery) {
          const q = this.state.searchQuery;
          result = result.filter(b =>
            b.title.toLowerCase().includes(q) ||
            b.author.toLowerCase().includes(q) ||
            (b.description && b.description.toLowerCase().includes(q)) ||
            (b.tags && (
              b.tags.type.toLowerCase().includes(q) ||
              b.tags.category.toLowerCase().includes(q) ||
              b.tags.niche.toLowerCase().includes(q)
            ))
          );
        }
        result.sort((a, b) => a.title.localeCompare(b.title));
        return result;
      }
    };


    // Data from shared catalog (js/data.js)
    let booksData = window.PF.booksData || [];

    // State
    let books = [...booksData];
    let currentIndex = 0, isTransitioning = false, activeBg = 1, arcToggle = false;
    let cart = JSON.parse(localStorage.getItem('pf_cart')) || [];

    // Elements
    const bb1 = document.getElementById('bb1'), bb2 = document.getElementById('bb2'), sliderTrack = document.getElementById('sliderTrack'), arcTrack = document.getElementById('arcTrack'), galleryOv = document.getElementById('galleryOv'), galleryGrid = document.getElementById('galleryGrid'), collOv = document.getElementById('collOv'), collGrid = document.getElementById('collGrid'), collPreview = document.getElementById('collPreview'), collItems = document.getElementById('collItems'), folderBadge = document.getElementById('folderBadge');

    // Search UI Elements
    const searchInput = document.getElementById('gallerySearch');
    const galleryEmpty = document.getElementById('galleryEmpty');

    // --- Search UI Logic ---
    function initSearchUI() {
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          SearchModule.setSearch(e.target.value);
          renderGallery();
        });
      }
    }




    // --- Helpers ---
    function bookKey(id) {
      const numeric = Number(id);
      return Number.isFinite(numeric) ? numeric : String(id);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function safeCoverUrl(value) {
      const raw = String(value || '').trim();
      if (/^assets\/covers\/[a-zA-Z0-9._/-]+$/.test(raw)) return raw;

      try {
        const url = new URL(raw);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch {
        return '';
      }
    }

    function canPurchaseBook(book) {
      return book && book.status === 'available' && (book.stock ?? 1) > 0;
    }

    function hasPrice(book) {
      return Number.isFinite(Number(book?.price)) && Number(book.price) > 0;
    }

    function getPriceText(book) {
      return hasPrice(book) ? `NGN ${Number(book.price).toLocaleString()}` : 'Price confirmed by store';
    }

    function cartIndex(id) {
      const key = bookKey(id);
      return cart.findIndex(item => bookKey(item.id) === key);
    }

    function addToCart(book) {
      if (!canPurchaseBook(book) || cartIndex(book.id) !== -1) return false;
      cart.push({ ...book, id: bookKey(book.id), addedAt: Date.now() });
      return true;
    }

    function removeFromCart(id) {
      const key = bookKey(id);
      const before = cart.length;
      cart = cart.filter(item => bookKey(item.id) !== key);
      return cart.length !== before;
    }

    function renderCover(book, className = '') {
      const coverUrl = safeCoverUrl(book.coverImage);
      if (!coverUrl) {
        return `<div class="cover-fallback ${className}" role="img" aria-label="Cover unavailable for ${escapeHtml(book.title)}"><span>${escapeHtml(book.title)}</span></div>`;
      }
      return `<img loading="lazy" class="${className}" src="${escapeHtml(coverUrl)}" alt="${escapeHtml(book.title)}" onerror="handleCoverError(this)">`;
    }

    function handleCoverError(image) {
      const fallback = document.createElement('div');
      const label = document.createElement('span');
      fallback.className = 'cover-fallback';
      fallback.setAttribute('role', 'img');
      fallback.setAttribute('aria-label', `Cover unavailable for ${image.alt}`);
      label.textContent = image.alt;
      fallback.appendChild(label);
      image.replaceWith(fallback);
    }

    function getStatusClass(s) { return s === 'available' ? 'avail' : s === 'reserved' ? 'reserved' : 'unavail' }
    function getStatusText(s) { return s === 'available' ? 'Available' : s === 'reserved' ? 'Reserved' : 'Unavailable' }
    function isInCart(id) { return cartIndex(id) !== -1 }
    function getButtonState(book) {
      if (book.status === 'reserved') return { text: 'Reserved', cls: 'reserved', disabled: true };
      if (!canPurchaseBook(book)) return { text: 'Unavailable', cls: '', disabled: true };
      if (isInCart(book.id)) return { text: 'Remove', cls: 'in-cart', disabled: false };
      return { text: 'Add', cls: '', disabled: false };
    }

    function getLengthInfo(len) {
      if (len < 200) return { label: 'Short read', icon: 'M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm1-13h-2v6l5.25 3.15.75-1.23-4-2.37z' };
      if (len < 400) return { label: 'Medium read', icon: 'M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z' };
      return { label: 'Long read', icon: 'M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z' };
    }

    function createSlide(book, idx) {
      const sc = getStatusClass(book.status), st = getStatusText(book.status), bs = getButtonState(book);
      const len = 150 + (book.description.length * 2);
      const li = getLengthInfo(len);
      const cat = escapeHtml(book.tags.type.toUpperCase());
      const price = getPriceText(book);
      const accolades = [book.accolade, book.majorAward].filter(Boolean).join(' / ');
      const authorMeta = accolades || `${book.tags.category}${book.tags.niche ? ` / ${book.tags.niche}` : ''}`;
      return `<div class="slide"><div class="panel-cover"><div class="cover-c"><div class="book-cover">${renderCover(book)}</div></div></div><div class="panel-content"><div class="content-w"><div class="status-badge"><span class="status-dot ${sc}"></span><span class="status-text ${sc}">${st}</span></div><div class="title-row"><h1 class="book-title">${escapeHtml(book.title)}</h1><button class="add-btn ${bs.cls}" data-idx="${idx}"${bs.disabled ? ' disabled' : ''}>${bs.text}</button></div><div class="price-tag" style="font-family:var(--fb);font-size:1.1rem;color:var(--gold);margin-top:-0.5rem;margin-bottom:0.5rem">${price}</div><p class="book-subtitle">${escapeHtml(book.subtitle)}</p><div class="book-desc"><p>${escapeHtml(book.description)}</p></div><div class="book-meta-row" style="display:flex;align-items:center;gap:6px;margin-bottom:1.5rem;color:var(--stone);font-family:var(--fs);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;font-weight:500">${cat} &bull; ${li.label}</div><div class="genre-tags">${[book.tags.category, book.tags.niche].filter(Boolean).map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('')}</div><div class="author-sec"><div class="author-name">${escapeHtml(book.author)}</div><div class="author-acc">${escapeHtml(authorMeta)}</div></div></div></div></div>`;
    }

    function initSlider() {
      if (!books.length) {
        sliderTrack.innerHTML = '<div class="coll-empty-state"><div class="coll-empty-text">No books are available in the catalog yet.</div></div>';
        return;
      }
      currentIndex = Math.min(currentIndex, books.length - 1);
      sliderTrack.innerHTML = books.map((b, i) => createSlide(b, i)).join('');
      updateSliderPosition();
      updateBg(true);
      initArc();
      bindAddBtns();
    }

    function updateSliderPosition() {
      Array.from(sliderTrack.children).forEach((slide, i) => {
        slide.classList.toggle('active', i === currentIndex);
      });
    }

    function updateBg(imm = false) {
      const book = books[currentIndex], inc = activeBg === 1 ? bb2 : bb1, out = activeBg === 1 ? bb1 : bb2;
      const coverUrl = safeCoverUrl(book.coverImage);
      inc.style.backgroundImage = coverUrl ? `url("${coverUrl.replace(/"/g, '%22')}")` : 'none';
      if (imm) { inc.classList.add('active') }
      else { setTimeout(() => { inc.classList.add('active'); out.classList.remove('active') }, 50) }
      activeBg = activeBg === 1 ? 2 : 1;
    }

    function initArc() {
      const track = document.getElementById('arcTrack');
      track.innerHTML = '';
      for (let i = -3; i <= 3; i++) {
        const slot = document.createElement('div');
        slot.className = 'arc-slot';
        slot.dataset.pos = i;
        slot.innerHTML = `<div class="arc-thumb"><img class="l1 active" src=""><img class="l2" src=""></div><div class="arc-label-c"><div class="arc-label"></div></div>`;
        slot.addEventListener('click', () => navigate(i));
        track.appendChild(slot);
      }
      updateArc();
    }

    function updateArc() {
      const track = document.getElementById('arcTrack');
      for (let i = -3; i <= 3; i++) {
        const idx = (currentIndex + i + books.length) % books.length;
        const book = books[idx];
        const slot = track.querySelector(`.arc-slot[data-pos="${i}"]`);
        if (!slot) continue;

        const imgInc = arcToggle ? slot.querySelector('.l2') : slot.querySelector('.l1');
        const imgOut = arcToggle ? slot.querySelector('.l1') : slot.querySelector('.l2');
        const txt = slot.querySelector('.arc-label');
        const coverUrl = safeCoverUrl(book.coverImage);

        slot.classList.toggle('missing-cover', !coverUrl);
        if (coverUrl) {
          imgInc.src = coverUrl;
        } else {
          imgInc.removeAttribute('src');
        }
        txt.textContent = book.title;

        imgInc.classList.add('active');
        imgOut.classList.remove('active');
        if (i === 0) txt.classList.add('active');
      }
      arcToggle = !arcToggle;
    }

    function goToBook(idx) {
      if (isTransitioning || idx === currentIndex) return;
      isTransitioning = true;
      sliderTrack.classList.add('transitioning');
      currentIndex = idx;
      updateSliderPosition();
      updateBg();
      updateArc();
      bindAddBtns();
      setTimeout(() => sliderTrack.classList.remove('transitioning'), 650);
      setTimeout(() => isTransitioning = false, 650);
    }

    function navigate(dir) {
      if (isTransitioning) return;
      isTransitioning = true;
      sliderTrack.classList.add('transitioning');
      currentIndex = (currentIndex + dir + books.length) % books.length;
      updateSliderPosition();
      updateBg();
      updateArc();
      bindAddBtns();
      setTimeout(() => sliderTrack.classList.remove('transitioning'), 650);
      setTimeout(() => isTransitioning = false, 650);
    }

    function bindAddBtns() {
      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.idx), book = books[idx];
          if (!book) return;
          if (isInCart(book.id)) {
            removeFromCart(book.id);
            btn.classList.remove('in-cart');
            btn.textContent = 'Add';
          } else {
            addToCart(book);
            btn.classList.add('in-cart');
            btn.textContent = 'Remove';
          }
          updateCartUI();
          renderGallery();
        };
      });
    }

    function saveCart() { localStorage.setItem('pf_cart', JSON.stringify(cart)); }

    function updateCartUI() {
      saveCart();
      const cnt = cart.length;
      folderBadge.textContent = cnt;
      folderBadge.classList.toggle('visible', cnt > 0);

      const totalEl = document.getElementById('collPreviewTotal');
      if (totalEl) totalEl.textContent = cart.length ? 'Transfer after checkout' : 'No books selected';

      const recent = [...cart].sort((a, b) => b.addedAt - a.addedAt).slice(0, 3);
      if (recent.length) {
        collItems.innerHTML = recent.map(b => `<div class="coll-item"><div class="coll-thumb">${renderCover(b)}</div><div class="coll-info" style="display:flex;flex-direction:column"><div class="coll-title">${escapeHtml(b.title)}</div><div class="coll-price" style="font-size:0.7rem;color:var(--gold)">${getPriceText(b)}</div></div></div>`).join('');
      } else {
        collItems.innerHTML = '<div class="coll-empty">Your cart is empty</div>';
      }
    }

    function openCartModal() {
      collPreview.classList.remove('open');
      if (!cart.length) {
        collGrid.innerHTML = '<div class="coll-empty-state"><div class="coll-empty-text">Your cart is empty</div><button class="coll-add-books-btn" id="collAddBooksBtn">Browse books</button></div>';
        document.getElementById('collAddBooksBtn').addEventListener('click', () => {
          collOv.classList.remove('active');
        });
      } else {
        const listHtml = cart.map(b => {
          const sc = getStatusClass(b.status);
          return `<div class="coll-card" data-id="${b.id}"><div class="coll-card-status ${sc}"></div><button class="coll-remove" data-id="${b.id}">-</button><div class="coll-card-img">${renderCover(b)}</div><div class="coll-card-title">${escapeHtml(b.title)}</div><div class="coll-card-price" style="color:var(--gold);font-family:var(--fb);margin-bottom:0.5rem">${getPriceText(b)}</div><div class="coll-card-desc">${escapeHtml(b.description)}</div><div class="coll-card-tags">${[b.tags.category, b.tags.niche].filter(Boolean).map(g => `<span class="coll-card-tag">${escapeHtml(g)}</span>`).join('')}</div></div>`;
        }).join('');

        const footerHtml = `
          <div class="coll-footer" style="grid-column:1/-1;border-top:1px solid var(--sand);padding-top:1rem;margin-top:1rem;display:flex;justify-content:space-between;align-items:center">
            <div class="coll-total" style="font-family:var(--fb);font-size:1.2rem;color:var(--char)">${cart.length} book${cart.length === 1 ? '' : 's'} selected</div>
            <button class="request-submit-btn" id="requestSubmitBtn" style="padding:0.8rem 2rem;background:var(--gold);color:#fff;border:none;border-radius:2rem;font-family:var(--fb);text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;font-weight:600">Checkout</button>
          </div>
        `;

        collGrid.innerHTML = listHtml + footerHtml;

        document.getElementById('requestSubmitBtn').onclick = () => {
          startPurchase();
        };

        collGrid.querySelectorAll('.coll-remove').forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            if (btn.classList.contains('confirm')) {
              const id = btn.dataset.id;
              removeFromCart(id);
              updateCartUI();
              openCartModal();
              sliderTrack.innerHTML = books.map((b, i) => createSlide(b, i)).join('');
              updateSliderPosition();
              bindAddBtns();
              renderGallery();
            } else {
              btn.classList.add('confirm');
              btn.textContent = 'Remove?';
              setTimeout(() => { if (btn.classList.contains('confirm')) { btn.classList.remove('confirm'); btn.textContent = '-' } }, 2000);
            }
          };
        });
      }
      collOv.classList.add('active');
    }

    function getStatusTagHTML(book, inColl) {
      if (!book) return '';
      const sc = getStatusClass(book.status);
      const isAvail = book.status === 'available';
      if (inColl && isAvail) return '<span class="gallery-status-tag added">Added</span>';
      let text = 'Available';
      if (book.status === 'reserved') text = 'Reserved';
      if (book.status === 'unavailable') text = 'Unavailable';
      return `<span class="gallery-status-tag ${sc}">${text}</span>`;
    }

    // --- Gallery Logic ---
    function renderGallery() {
      const filtered = SearchModule.process(books);
      const groups = {};

      // Empty State
      if (filtered.length === 0) {
        galleryGrid.innerHTML = '';
        galleryEmpty.classList.add('visible');
        return;
      } else {
        galleryEmpty.classList.remove('visible');
      }

      // Grouping
      filtered.forEach(b => {
        const l = b.title[0].toUpperCase();
        if (!groups[l]) groups[l] = [];
        groups[l].push(b);
      });

      const letters = Object.keys(groups).sort();

      galleryGrid.innerHTML = letters.map(l => {
        const list = groups[l];
        const items = list.map(b => {
          const origIdx = books.findIndex(x => bookKey(x.id) === bookKey(b.id));
          const inC = isInCart(b.id);
          const canAdd = canPurchaseBook(b);
          const btnText = inC ? '-' : '+';
          const btnCls = inC ? ' in-cart' : '';
          return `<div class="gallery-item" data-index="${origIdx}" data-id="${b.id}"><div class="gallery-cover">${getStatusTagHTML(b, inC)}${renderCover(b)}${canAdd ? `<button class="gallery-add-btn${btnCls}" data-id="${b.id}" aria-label="${inC ? 'Remove from cart' : 'Add to cart'}">${btnText}</button>` : ''}</div><div class="gallery-info"><div class="gallery-book-title">${escapeHtml(b.title)}</div><div class="gallery-author">${escapeHtml(b.author)}</div></div></div>`;
        }).join('');
        return `<div class="gallery-section"><div class="gallery-letter">${l}</div><div class="gallery-group">${items}</div></div>`;
      }).join('');

      // Listeners
      galleryGrid.querySelectorAll('.gallery-letter').forEach(hdr => {
        hdr.addEventListener('click', () => {
          hdr.parentElement.classList.toggle('collapsed');
          const grp = hdr.nextElementSibling;
          // Toggle collapse indicator if implemented (CSS based)
          // Current CSS doesn't show +/- logic here? 
          // Previous implementation had it.
          // It was: .gallery-letter::after { content: "-"; ... }
          // .gallery-section.collapsed .gallery-letter::after { content: "+"; }
          // That CSS is still in the file (I didn't remove it). So it works.
        });
      });

      galleryGrid.querySelectorAll('.gallery-item').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.closest('.gallery-add-btn')) return;
          goToBook(parseInt(el.dataset.index));
          galleryOv.classList.remove('active');
        });
      });

      galleryGrid.querySelectorAll('.gallery-add-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const book = books.find(b => bookKey(b.id) === bookKey(id));
          if (!book) return;
          const galleryItem = btn.closest('.gallery-item');
          const galleryCover = galleryItem.querySelector('.gallery-cover');
          let statusTag = galleryCover.querySelector('.gallery-status-tag');

          if (isInCart(id)) {
            removeFromCart(id);
            btn.classList.remove('in-cart');
            btn.textContent = '+';
            if (statusTag) {
              const sc = getStatusClass(book.status);
              statusTag.className = `gallery-status-tag ${sc}`;
              statusTag.textContent = getStatusText(book.status);
            }
          } else {
            addToCart(book);
            btn.classList.add('in-cart');
            btn.textContent = '-';
            if (statusTag && book.status === 'available') {
              statusTag.className = 'gallery-status-tag added';
              statusTag.textContent = 'Added';
            }
          }
          updateCartUI();
          sliderTrack.innerHTML = books.map((b, i) => createSlide(b, i)).join('');
          updateSliderPosition();
          bindAddBtns();
        });
      });
    }

    function openGallery() {
      renderGallery();
      galleryOv.classList.add('active');
    }

    function sortCatalog(items) {
      return [...items].sort((a, b) => {
        const aRank = canPurchaseBook(a) ? 0 : 1;
        const bRank = canPurchaseBook(b) ? 0 : 1;
        if (aRank !== bRank) return aRank - bRank;
        return a.title.localeCompare(b.title);
      });
    }

    function reconcileCart() {
      const seen = new Set();
      cart = cart
        .map(item => books.find(book => bookKey(book.id) === bookKey(item.id)))
        .filter(book => book && canPurchaseBook(book))
        .filter(book => {
          const key = bookKey(book.id);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .map(book => ({ ...book, id: bookKey(book.id), addedAt: Date.now() }));
    }

    // Bindings
    document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
    document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
    window.PF.Theme.init(document.getElementById('themeToggle'));
    document.getElementById('fullListBtn').addEventListener('click', openGallery);
    document.getElementById('galleryClose').addEventListener('click', () => galleryOv.classList.remove('active'));
    document.getElementById('folderBtn').addEventListener('click', () => collPreview.classList.toggle('open'));
    document.getElementById('viewAllBtn').addEventListener('click', openCartModal);
    document.getElementById('collClose').addEventListener('click', () => collOv.classList.remove('active'));
    document.getElementById('collOv').addEventListener('click', e => { if (e.target === collOv) collOv.classList.remove('active') });
    document.addEventListener('keydown', e => { if (galleryOv.classList.contains('active') || collOv.classList.contains('active') || requestOv.classList.contains('active')) { if (e.key === 'Escape') { galleryOv.classList.remove('active'); collOv.classList.remove('active'); requestOv.classList.remove('active') } return } if (e.key === 'ArrowLeft') navigate(-1); if (e.key === 'ArrowRight') navigate(1) });
    let wt; document.addEventListener('wheel', e => { if (galleryOv.classList.contains('active') || collOv.classList.contains('active') || requestOv.classList.contains('active')) return; e.preventDefault(); clearTimeout(wt); wt = setTimeout(() => { if (Math.abs(e.deltaY) > 30) navigate(e.deltaY > 0 ? 1 : -1) }, 50) }, { passive: false });
    let tsx = 0; document.addEventListener('touchstart', e => { tsx = e.touches[0].clientX }, { passive: true }); document.addEventListener('touchend', e => { const d = tsx - e.changedTouches[0].clientX; if (Math.abs(d) > 60) navigate(d > 0 ? 1 : -1) }, { passive: true });
    document.addEventListener('click', e => { if (!e.target.closest('.folder-btn') && !e.target.closest('.coll-preview')) collPreview.classList.remove('open') });

    // Init
    async function initApp() {
      books = sortCatalog(booksData);
      const supabase = window.PF && window.PF.supabaseReady
        ? await window.PF.supabaseReady
        : null;
      const useRemoteCatalog = Boolean(
        window.PF_CONFIG &&
        window.PF_CONFIG.supabase &&
        window.PF_CONFIG.supabase.useRemoteCatalog
      );
      if (supabase && useRemoteCatalog) {
        const { data, error } = await supabase.from('books').select('*');
        if (error) console.error('Supabase error:', error);
        else if (data) {
          books = sortCatalog(data.map(b => ({
            id: b.id,
            title: b.title,
            author: b.author,
            subtitle: b.subtitle,
            description: b.description,
            coverImage: b.cover_image,
            tags: {
              type: b.primary_type,
              category: b.main_category,
              niche: b.niche
            },
            popularity: {
              author: b.author_popularity || 0.5,
              book: b.book_popularity || 0.5
            },
            status: (b.stock > 0 && b.status !== 'unavailable') ? b.status : 'unavailable',
            stock: b.stock,
            price: b.price
          })));
        }
      }
      reconcileCart();
      initSlider(); updateCartUI(); initSearchUI();
    }
    initApp().catch(e => console.error('[PF Index] Init error:', e)).finally(() => {
      // Ensure page is always visible even if init fails
      setTimeout(() => document.body.classList.add('loaded'), 100);
    });

    // --- Purchase Logic ---
    const requestOv = document.getElementById('requestOv');
    const requestBody = document.getElementById('requestBody');
    const requestClose = document.getElementById('requestClose');

    requestClose.onclick = () => requestOv.classList.remove('active');
    requestOv.addEventListener('click', event => {
      if (event.target === requestOv) requestOv.classList.remove('active');
    });

    function getStoreConfig() {
      return (window.PF_CONFIG && window.PF_CONFIG.store) || {};
    }

    function showRequestErrors(errors) {
      requestBody.querySelectorAll('[data-error-for]').forEach(element => {
        element.textContent = errors[element.dataset.errorFor] || '';
      });
    }

    function startPurchase() {
      if (!cart.length) {
        openCartModal();
        return;
      }
      collOv.classList.remove('active');
      renderPaymentStep();
      requestOv.classList.add('active');
    }

    function renderPaymentStep() {
      const config = getStoreConfig();
      const itemsHtml = cart.map(b => `<li>${escapeHtml(b.title)} <span>${escapeHtml(b.author)}</span></li>`).join('');
      requestBody.innerHTML = `
        <div class="request-form">
          <div>
            <h4>Complete purchase</h4>
            <p class="request-intro">Transfer payment to the account below, then continue to add delivery and receipt details.</p>
          </div>
          <ul class="request-summary">${itemsHtml}</ul>
          <div class="payment-panel" aria-label="Bank transfer details">
            <div>
              <span>Bank</span>
              <strong>${escapeHtml(config.bankName || 'Set bank name in js/config.js')}</strong>
            </div>
            <div>
              <span>Account number</span>
              <button class="account-copy" id="copyAccountBtn" type="button">${escapeHtml(config.accountNumber || 'Set account number')}</button>
            </div>
            <div>
              <span>Account name</span>
              <strong>${escapeHtml(config.accountName || 'Pages Forward')}</strong>
            </div>
          </div>
          <div class="request-form-footer">
            <p class="request-form-status" id="requestFormStatus" role="status"></p>
            <button class="request-primary-btn" id="continuePurchaseBtn" type="button">I have paid</button>
          </div>
        </div>`;

      document.getElementById('continuePurchaseBtn').addEventListener('click', renderPurchaseForm);
      document.getElementById('copyAccountBtn').addEventListener('click', async () => {
        const status = document.getElementById('requestFormStatus');
        try {
          await navigator.clipboard.writeText(config.accountNumber || '');
          status.textContent = 'Account number copied.';
        } catch {
          status.textContent = 'Copy unavailable. Select the account number manually.';
        }
      });
    }

    function renderPurchaseForm() {
      requestBody.innerHTML = `
        <form class="request-form" id="purchaseForm" novalidate>
          <div>
            <h4>Delivery and receipt</h4>
            <p class="request-intro">Your phone number lets us contact you to confirm payment, delivery timing, and any book availability issue.</p>
          </div>
          <div class="request-fields">
            <label class="request-field">
              <span>Delivery address</span>
              <textarea name="address" rows="3" autocomplete="street-address" maxlength="300" required></textarea>
              <small data-error-for="address"></small>
            </label>
            <label class="request-field">
              <span>Phone number</span>
              <input name="phone" type="tel" autocomplete="tel" maxlength="40" required>
              <small data-error-for="phone"></small>
            </label>
            <label class="request-field">
              <span>Transaction receipt</span>
              <input name="receipt" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" required>
              <em>PDF, JPG, PNG, or WebP. Max 5 MB.</em>
              <small data-error-for="receipt"></small>
            </label>
          </div>
          <div class="request-form-footer">
            <p class="request-form-status" id="requestFormStatus" role="status"></p>
            <button class="request-primary-btn" type="submit">Save Purchase</button>
          </div>
        </form>`;
      document.getElementById('purchaseForm').addEventListener('submit', completePurchase);
    }

    async function completePurchase(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const submitButton = form.querySelector('button[type="submit"]');
      const status = document.getElementById('requestFormStatus');
      const purchaseItems = cart.map(b => ({ id: bookKey(b.id), title: b.title, author: b.author, price: b.price }));
      const receiptFile = form.elements.receipt.files && form.elements.receipt.files[0];
      const draft = {
        items: purchaseItems,
        customer: {
          address: form.elements.address.value,
          phone: form.elements.phone.value
        },
        receiptFile
      };

      const validation = window.PF.Purchases.validate(draft);
      showRequestErrors(validation.errors);
      if (!validation.valid) {
        status.textContent = 'Review the highlighted details.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Saving...';
      status.textContent = '';

      let purchase;
      try {
        purchase = window.PF.Purchases.create(draft);
        purchase = await window.PF.Purchases.sync(purchase, receiptFile);
      } catch (error) {
        status.textContent = error.message || 'The purchase could not be saved.';
        submitButton.disabled = false;
        submitButton.textContent = 'Save Purchase';
        return;
      }

      window.PF.lastPurchase = purchase;
      const syncMessage = purchase.syncStatus === 'synced'
        ? 'The purchase was sent to the bookstore.'
        : 'The purchase is saved on this device. Use WhatsApp to send it to the bookstore.';

      requestBody.innerHTML = `
        <div class="request-success">
          <div class="request-success-mark" aria-hidden="true">OK</div>
          <h3>Purchase Saved</h3>
          <p>Your purchase ID is <strong>${escapeHtml(purchase.id)}</strong>.</p>
          <p>${syncMessage}</p>
          <div class="request-success-actions">
            <a class="request-primary-btn" id="whatsAppPurchaseBtn" href="${escapeHtml(window.PF.Purchases.getWhatsAppUrl(purchase))}" target="_blank" rel="noopener">Reach out on WhatsApp</a>
            <button class="request-secondary-btn" id="sharePurchaseBtn" type="button">Share</button>
            <button class="request-secondary-btn" id="copyRequestBtn" type="button">Copy</button>
            <a class="request-secondary-btn" href="purchases.html">Purchases</a>
          </div>
          <div class="request-action-status" id="requestActionStatus" role="status"></div>
        </div>`;

      document.getElementById('sharePurchaseBtn').addEventListener('click', sharePurchase);
      document.getElementById('copyRequestBtn').addEventListener('click', copyPurchaseText);
      cart = [];
      updateCartUI();
      initSlider();
    }

    async function copyPurchaseText() {
      const status = document.getElementById('requestActionStatus');
      try {
        await window.PF.Purchases.copy(window.PF.lastPurchase);
        if (status) status.textContent = 'Purchase copied.';
      } catch (error) {
        if (status) status.textContent = 'Copy is unavailable. Open Purchases to view the details.';
      }
    }

    async function sharePurchase() {
      const status = document.getElementById('requestActionStatus');
      try {
        const result = await window.PF.Purchases.share(window.PF.lastPurchase);
        if (status) status.textContent = result === 'copied'
          ? 'Sharing is unavailable, so the purchase was copied.'
          : 'Purchase shared.';
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        if (status) status.textContent = 'Sharing was not completed.';
      }
    }

    // Intro
    if (!document.body.classList.contains('skip-intro')) {
      setTimeout(() => {
        const ios = document.getElementById('introOverlay');
        if (ios) { ios.style.display = 'none'; localStorage.setItem('pfIntroSeen', 'true'); }
      }, 4500);
    }
    // Fonts
    document.fonts.ready.then(() => { document.body.classList.add('loaded'); });
    setTimeout(() => document.body.classList.add('loaded'), 2000);

  </script>
</body>

</html>
