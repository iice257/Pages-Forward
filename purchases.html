<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Purchases | Pages Forward</title>
  <meta name="description" content="Review and share Pages Forward purchases saved on this device.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/purchases.css">
</head>

<body class="requests-page loaded">
  <header class="requests-header">
    <a class="requests-brand" href="index.html">Pages Forward</a>
    <div class="requests-header-actions">
      <button class="requests-icon-btn" id="themeToggle" type="button" aria-label="Toggle color theme" title="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <a class="requests-link" href="index.html">Catalog</a>
    </div>
  </header>

  <main class="requests-main">
    <div class="requests-title-row">
      <div>
        <h1 class="requests-title">My Purchases</h1>
        <p class="requests-subtitle">Purchases saved in this browser with receipt and delivery details.</p>
      </div>
      <div class="requests-count" id="purchasesCount"></div>
    </div>
    <div class="requests-list" id="purchasesList"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/purchases.js"></script>
  <script>
    (function () {
      'use strict';

      const list = document.getElementById('purchasesList');
      const count = document.getElementById('purchasesCount');

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? 'Date unavailable'
          : date.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      }

      function render() {
        const purchases = window.PF.Purchases.load();
        count.textContent = `${purchases.length} purchase${purchases.length === 1 ? '' : 's'}`;

        if (!purchases.length) {
          list.innerHTML = `
            <div class="requests-empty">
              <h2>No saved purchases</h2>
              <p>Add an available book to cart and upload a receipt to complete a purchase.</p>
              <a class="requests-link" href="index.html">Browse Catalog</a>
            </div>`;
          return;
        }

        list.innerHTML = purchases.map(purchase => {
          const itemList = purchase.items.map(item =>
            `<li>${escapeHtml(item.title)} <span>by ${escapeHtml(item.author)}</span></li>`
          ).join('');
          const phone = purchase.customer.phone || 'Phone not recorded';
          const receipt = purchase.receipt && purchase.receipt.name
            ? purchase.receipt.name
            : 'Receipt uploaded';
          const syncLabel = purchase.syncStatus === 'synced' ? 'Sent to store' : 'Saved locally';

          return `
            <article class="request-record" data-id="${escapeHtml(purchase.id)}">
              <div>
                <div class="request-record-head">
                  <span class="request-record-id">${escapeHtml(purchase.id)}</span>
                  <span class="request-record-status">${syncLabel}</span>
                  <span class="request-record-date">${escapeHtml(formatDate(purchase.createdAt))}</span>
                </div>
                <h2>${purchase.items.length} book${purchase.items.length === 1 ? '' : 's'}</h2>
                <div class="request-record-meta">${escapeHtml(phone)} &bull; ${escapeHtml(receipt)}</div>
                <ul class="request-record-items">${itemList}</ul>
              </div>
              <div class="request-record-actions">
                <a href="${escapeHtml(window.PF.Purchases.getWhatsAppUrl(purchase))}" target="_blank" rel="noopener">WhatsApp</a>
                <button type="button" data-action="share">Share</button>
                <button type="button" data-action="copy">Copy</button>
                <button class="danger" type="button" data-action="remove">Remove</button>
                <div class="request-record-message" role="status"></div>
              </div>
            </article>`;
        }).join('');
      }

      async function handleAction(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const record = button.closest('.request-record');
        const message = record.querySelector('.request-record-message');
        const purchase = window.PF.Purchases.load()
          .find(item => item.id === record.dataset.id);
        if (!purchase) return;

        if (button.dataset.action === 'remove') {
          if (button.dataset.confirm !== 'true') {
            button.dataset.confirm = 'true';
            button.textContent = 'Confirm';
            message.textContent = 'Select Confirm to remove this local record.';
            return;
          }
          window.PF.Purchases.remove(purchase.id);
          render();
          return;
        }

        try {
          if (button.dataset.action === 'share') {
            const result = await window.PF.Purchases.share(purchase);
            message.textContent = result === 'copied'
              ? 'Sharing is unavailable, so the purchase was copied.'
              : 'Purchase shared.';
          } else {
            await window.PF.Purchases.copy(purchase);
            message.textContent = 'Purchase copied.';
          }
        } catch (error) {
          if (error && error.name === 'AbortError') return;
          message.textContent = 'That action is unavailable in this browser.';
        }
      }

      window.PF.Theme.init(document.getElementById('themeToggle'));
      list.addEventListener('click', handleAction);
      render();
    })();
  </script>
</body>

</html>
